# application-dev.properties
spring.jpa.hibernate.ddl-auto=create-drop
spring.ai.vectorstore.pgvector.remove-existing-vector-store-table=true

# Using Mailtrap Sandbox service for testing email deliverance
spring.mail.host=${DEV_MAIL_HOST}
spring.mail.port=${DEV_MAIL_PORT}
spring.mail.username=${DEV_MAIL_USERNAME}
spring.mail.password=${DEV_MAIL_PASSWORD}
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true

app.mail.from=huccip@sharp-oclock.dev

app.admin.identifier=${ADMIN_IDENTIFIER}
app.admin.password-hash=${ADMIN_PASSWORD_HASH}

app.password-reset.otp-expiry-seconds=600
app.password-reset.otp-resend-cooldown-seconds=60
app.password-reset.otp-max-attempts=5
paypal.mode=sandbox
paypal.client.app=${PAYPAL_CLIENT_APP}
paypal.client.secret=${PAYPAL_CLIENT_SECRET}
stripe.api-key=${STRIPE_API_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
stripe.success.url=${STRIPE_SUCCESS_URL}
stripe.cancel.url=${STRIPE_CANCEL_URL}