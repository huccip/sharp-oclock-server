spring.profiles.active=dev

spring.application.name=sharp-oclock-server

spring.datasource.url=jdbc:postgresql://${NEON_HOST}:5432/neondb?sslmode=require
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=create-drop
spring.data.redis.url=${UPSTASH_REDIS_URL}

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=sharp-oclock-server
app.jwt.audience=sharp-oclock-api
app.jwt.client-id=sharp-oclock-mobile
app.jwt.access-token-expiry-seconds=900
app.jwt.refresh-token-expiry-seconds=2592000

app.mail.from=${RESEND_MAIL_ADDRESS}
spring.mail.host=smtp.resend.com
spring.mail.port=25
spring.mail.username=resend
spring.mail.password=${RESEND_API_KEY}
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.starttls.required]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.embedding.api-key=${GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.6-flash
spring.ai.google.genai.embedding.text.dimensions=768
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.initialize-schema=true