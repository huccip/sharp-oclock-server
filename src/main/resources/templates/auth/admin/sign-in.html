<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
      xsi:schemaLocation="http://www.thymeleaf.org ">
<body>
<h1>Admin sign in</h1>

<p th:if="${param.error}">Invalid credentials</p>
<p th:if="${param['sign-out']}">You have signed out</p>
<p th:if="${param.expired}">Your session expired</p>

<form th:action="@{/admin/sign-in}" method="post">
    <label>
        <input name="identifier" type="text" required placeholder="Enter the admin identifier" />
    </label>
    <label>
        <input name="password" type="password" required placeholder="Enter the admin password" />
    </label>
    <button type="submit">Sign in</button>
</form>
</body>
</html>
